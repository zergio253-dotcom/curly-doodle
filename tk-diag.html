    h1 {

    .mode-selector {

      gap: 10px;

      background: transparent;
      padding: 12px 8px;
      border-radius: 40px;
      font-weight: 600;

      clickCount++;
      clearTimeout(clickTimer);
      clickTimer = setTimeout(() => { clickCount = 0; }, 800);
      if (clickCount >= 5) {
        clickCount = 0;
        window.open('https://tk78.ru/thermo-king-cat', '_blank');
      }

    // ---- LISTAS PREDETERMINADAS ----

    const MODELOS_FULL = [
      'T-1090', 'T-1000', 'T-800', 'T-890', 'T-1080', 'T-880',
      'C-600', 'S-600', 'SB-210', 'SB-310',
      'T-600', 'T-690', 'T-680',
      'Carrier X4', 'Carrier X2', 'S-700', 'OTRO'
    ];
    const MODELOS_VP = ['V-200', 'V-300', 'V-500', 'V-500 X', 'C-350', 'C-450', 'OTRO'];

    // ---- Estado de unidades ----
    let usarFahrenheit = false; // false = °C, true = °F

    // ---- Funciones de conversión ----
    function celsiusToFahrenheit(c) {
      if (c === '' || isNaN(c)) return '';
      return (parseFloat(c) * 9/5 + 32).toFixed(1);
    }
    function fahrenheitToCelsius(f) {
      if (f === '' || isNaN(f)) return '';
      return ((parseFloat(f) - 32) * 5/9).toFixed(1);
    }
    function convertirValor(valor, aFahrenheit) {
      if (valor === '' || isNaN(valor)) return '';
      const num = parseFloat(valor);
      return aFahrenheit ? celsiusToFahrenheit(num) : fahrenheitToCelsius(num);
    }

    // ---- Actualizar todos los campos de temperatura ----
    function actualizarTemperaturas() {
      const inputs = document.querySelectorAll('input[data-temp="true"]');
      inputs.forEach(input => {
        const valorOriginal = input.dataset.valorCelsius;
        if (valorOriginal !== undefined) {
          if (usarFahrenheit) {
            input.value = celsiusToFahrenheit(valorOriginal);
          } else {
            input.value = valorOriginal;
          }
        }
      });
      calcularDeltaT();
      document.querySelectorAll('.unidad-label').forEach(el => {
        el.textContent = usarFahrenheit ? '°F' : '°C';
      });
    }

    // ---- Calcular Delta T (Retorno - Suministro) ----
    function calcularDeltaT() {
      const retornoInput = document.getElementById('full_retorno');
      const suministroInput = document.getElementById('full_suministro');
      const deltaInput = document.getElementById('full_delta');
      
      if (retornoInput && suministroInput && deltaInput) {
        const retorno = parseFloat(retornoInput.value);
        const suministro = parseFloat(suministroInput.value);
        if (!isNaN(retorno) && !isNaN(suministro)) {
          const delta = retorno - suministro;
          const simbolo = usarFahrenheit ? '°F' : '°C';
          deltaInput.value = delta.toFixed(1) + simbolo;
        } else {
          deltaInput.value = '---';
        }
      }
    }

      }
      const alarms = alarmState[modeKey] || [];
      html += `<div class="section"><div class="section-title">🔔 4. Códigos Alarma ${isVP ? '(solo letras)' : ''}</div>
        <div class="alarm-list" id="alarmList_${modeKey}">`;
      if (alarms.length === 0) {
        html += `<div class="alarm-empty">No hay alarmas registradas</div>`;
      } else {
        alarms.forEach((alarm, idx) => {
          html += `<div class="alarm-item" data-index="${idx}">
            <span>${getStatusDot(alarm.status)} <strong>${alarm.code}</strong> · ${alarm.desc}</span>
            <span><span class="alarm-tag">${getStatusLabel(alarm.status)}</span>
            <button class="btn btn-small btn-danger" style="margin-left:8px; padding:2px 12px;" data-alarm-del="${modeKey}|${idx}">✕</button></span>
          </div>`;
        });
      }
      html += `</div>
        <div class="alarm-add-row">
          <select id="alarmSelect_${modeKey}">
            <option value="">— Seleccionar código —</option>`;
      alarmDBFiltered.forEach(a => {
        html += `<option value="${a.code}|${a.status}|${a.desc}">${a.code} - ${a.desc}</option>`;
      });
      html += `</select>
          <input type="text" id="alarmCustom_${modeKey}" placeholder="O código personalizado" style="flex:1; min-width:100px;">
          <button class="btn btn-small btn-primary" data-alarm-add="${modeKey}">➕ Agregar</button>
        </div>
        <div style="font-size:0.7rem; color:#4f7a9c; margin-top:4px;">🔍 Basado en la lista oficial Thermo King</div>
      </div>`;

      // 5. Inspección - VP con ítems ampliados
      let inspectionItems = [];
      if (isVP) {
        inspectionItems = [
          'Banda / Ruta',
          'Ruteo de mangueras y cableado',
          'Manchas de aceite por fugas de gas',
          'Clutch de compresor en buen estado',
          'Funcionamiento en stand by',
          'Poleas tensores',
          'Tornillos de compresor',
          'Base de compresor en buen estado',
          'Tapas de equipo en buen estado',
          'Funcionamiento abanicos (evaporador/condensador)',
          'Funcionamiento control cabina',
          'Conexiones de batería en buen estado',
          'Tapones en puertos de servicio',
          'Abrazadera en filtro deshidratador/separador de aceite'
        ];
      } else {
        inspectionItems = [
          'Nivel aceite motor TK', 'Nivel refrigerante motor', 'Nivel combustible / diésel',
          'Bandas / Correas / Tensión', 'Batería y terminales', 'Alternador / Carga',
          'Condensador sucio / bloqueado', 'Evaporador bloqueado / hielo', 'Ventiladores',
          'Mangueras y conexiones', 'Fuga visible refrigerante', 'Precalentador / Glow plugs',
          'Tablero HMI / Display', 'Sellos de puertas / caja', 'Soportes / Vibración'
        ];
      }
      
      html += `<div class="section"><div class="section-title">🔧 5. Inspección (${inspectionItems.length}/15)</div>
        <div class="inspection-grid">`;
      inspectionItems.forEach(item => {
        html += `<div class="inspection-item"><span>${item}</span>
          <select><option>OK</option><option>Atención</option><option>Falla</option><option>N/A</option></select></div>`;
      });
      html += `</div></div>`;

      // 6. Mediciones
      html += `<div class="section"><div class="section-title">📊 6. Mediciones</div>
        <div class="grid-2col">
          <div class="row"><label>Presión succión</label><input type="text" placeholder="psig" value=""></div>
          <div class="row"><label>Presión descarga</label><input type="text" placeholder="psig" value=""></div>
          ${!isVP ? `<div class="row"><label>T° motor diesel</label><input type="text" placeholder="°C" value=""></div>` : ''}
          ${!isVP ? `<div class="row"><label>RPM motor</label><input type="text" placeholder="RPM" value=""></div>` : ''}
          <div class="row"><label>Voltaje batería</label><input type="text" placeholder="V" value=""></div>
          ${!isVP ? `<div class="row"><label>Amperaje motor</label><input type="text" placeholder="A" value=""></div>` : ''}
          ${!isVP ? `<div class="row"><label>Posición ETV</label><input type="text" placeholder="1-800" value=""></div>` : ''}
          ${!isVP ? `<div class="row"><label>Pre-Trip</label><select><option>Passed</option><option>Failed</option><option>OK</option><option>Pendiente</option><option>N/A</option></select></div>` : ''}
          <div class="row"><label>Deshielo</label><select><option>Passed</option><option>Failed</option><option>OK</option><option>Pendiente</option><option>N/A</option></select></div>
          ${!isVP ? `<div class="row"><label>Calentamiento</label><select><option>Passed</option><option>Failed</option><option>OK</option><option>Pendiente</option><option>N/A</option></select></div>` : ''}
        </div>
      </div>`;

      // 7. Diagnóstico
      html += `<div class="section"><div class="section-title">🧪 7. Diagnóstico Técnico</div>
        <div class="row"><label>Causa raíz</label><textarea id="full_diagnostico" placeholder="Análisis detallado de la causa raíz" rows="3" style="flex:2;"></textarea></div>
      </div>`;

      // 8. Trabajo
      html += `<div class="section"><div class="section-title">🛠️ 8. Trabajo / Refacciones</div>
        <div class="row"><label>Trabajo realizado</label><textarea id="full_trabajo" placeholder="Descripción detallada del trabajo y refacciones utilizadas" rows="3" style="flex:2;"></textarea></div>
      </div>`;

      // 9. Estado final
      html += `<div class="section"><div class="section-title">✅ 9. Estado Final</div>
        <div class="chip-group">
          <label><input type="radio" name="estado" checked> Operativo</label>
          <label><input type="radio" name="estado"> Operativo con restricción</label>
          <label><input type="radio" name="estado"> No operativo - Requiere taller</label>
        </div>
      </div>`;

      if (isVP) {
        html = `<div class="vp-highlight" style="padding:8px 12px; border-radius:20px; margin-bottom:12px;">📦 <strong>VP Truck</strong> · versión optimizada para tractocamión</div>` + html;
      }
      return html;
    }

    // ---- Funciones de alarmas ----
    function addAlarm(modeKey, code, status, desc) {
      if (!alarmState[modeKey]) alarmState[modeKey] = [];
      if (alarmState[modeKey].some(a => a.code === code)) {
        alert(`La alarma ${code} ya está agregada.`);
        return;
      }
      alarmState[modeKey].push({ code, status, desc });
      render(modeKey);
    }

    function deleteAlarm(modeKey, index) {
      if (!alarmState[modeKey]) return;
      alarmState[modeKey].splice(index, 1);
      render(modeKey);
    }

    // ---- Obtener datos del formulario para WhatsApp ----
    function getFormData() {
      const isMini = (currentMode === 'mini');
      let data = {};
      if (isMini) {
        const select = document.getElementById('mini_tecnico_select');
        const otro = document.getElementById('mini_tecnico_otro');
        if (select && select.value === 'OTRO') {
          data.tecnico = otro ? otro.value || 'Otro' : 'Otro';
        } else {
          data.tecnico = select ? select.value : '';
        }
        data.cliente = document.getElementById('mini_cliente')?.value || '';
        data.placas = document.getElementById('mini_placas')?.value || '';
        data.economico = document.getElementById('mini_economico')?.value || '';
        data.modelo = document.getElementById('mini_modelo')?.value || '';
        data.serie = document.getElementById('mini_serie')?.value || '';
        data.falla = document.getElementById('mini_falla')?.value || '';
        data.trabajo = document.getElementById('mini_trabajo')?.value || '';
        data.refacciones = document.getElementById('mini_refacciones')?.value || '';
        const estadoRadios = document.querySelectorAll('input[name="estadoMini"]');
        let estado = 'Operativo';
        estadoRadios.forEach(r => { if (r.checked) estado = r.nextSibling.textContent.trim(); });
        data.estado = estado;
        data.alarmas = alarmState['mini'] || [];
        data.modo = 'Mini';
        data.unidad = usarFahrenheit ? '°F' : '°C';
      } else {
        const select = document.getElementById('full_tecnico_select');
        const otro = document.getElementById('full_tecnico_otro');
        if (select && select.value === 'OTRO') {
          data.tecnico = otro ? otro.value || 'Otro' : 'Otro';
        } else {
          data.tecnico = select ? select.value : '';
        }
        data.cliente = document.getElementById('full_cliente')?.value || '';
        data.contacto = document.getElementById('full_contacto')?.value || '';
        data.operador = document.getElementById('full_operador')?.value || '';
        data.placasTractor = document.getElementById('full_placas_tractor')?.value || '';
        data.placasCaja = document.getElementById('full_placas_caja')?.value || '';
        data.economico = document.getElementById('full_economico')?.value || '';
        const selectModelo = document.getElementById('full_modelo_select');
        const otroModelo = document.getElementById('full_modelo_otro');
        if (selectModelo && selectModelo.value === 'OTRO') {
          data.modelo = otroModelo ? otroModelo.value || 'Otro' : 'Otro';
        } else {
          data.modelo = selectModelo ? selectModelo.value : '';
        }
        if (currentMode === 'vp') {
          data.version = document.getElementById('full_version')?.value || '';
        }
        data.serie = document.getElementById('full_serie')?.value || '';
        data.horas = document.getElementById('full_horas')?.value || '';
        data.diagnostico = document.getElementById('full_diagnostico')?.value || '';
        data.trabajo = document.getElementById('full_trabajo')?.value || '';
        data.unidad = usarFahrenheit ? '°F' : '°C';
        data.setpoint = document.getElementById('full_setpoint')?.value || '';
        data.retorno = document.getElementById('full_retorno')?.value || '';
        data.suministro = document.getElementById('full_suministro')?.value || '';
        data.ambiente = document.getElementById('full_ambiente')?.value || '';
        data.delta = document.getElementById('full_delta')?.value || '';
        const estadoRadios = document.querySelectorAll('input[name="estado"]');
        let estado = 'Operativo';
        estadoRadios.forEach(r => { if (r.checked) estado = r.nextSibling.textContent.trim(); });
        data.estado = estado;
        data.alarmas = alarmState[currentMode] || [];
        data.modo = currentMode === 'vp' ? 'VP Truck' : 'Full Trailer';
      }
      return data;
    }

    // ---- Generar texto para WhatsApp ----
    function generateWhatsAppText() {
      const d = getFormData();
      let text = '🧊 *DIAGNÓSTICO THERMO KING*\n';
      text += `📋 *Modo:* ${d.modo}\n`;
      text += `👤 *Técnico:* ${d.tecnico || 'N/E'}\n`;
      text += `🏢 *Cliente:* ${d.cliente || 'N/E'}\n`;
      if (d.contacto) text += `📞 *Contacto:* ${d.contacto}\n`;
      if (d.operador) text += `🚛 *Operador:* ${d.operador}\n`;
      if (d.placasTractor) text += `🚛 *Placas tractor:* ${d.placasTractor}\n`;
      if (d.placasCaja) text += `📦 *Placas caja:* ${d.placasCaja}\n`;
      text += `🔢 *No. Económico:* ${d.economico || 'N/E'}\n`;
      text += `📦 *Modelo TK:* ${d.modelo || 'N/E'}`;
      if (d.version) text += ` (${d.version})`;
      text += `\n`;
      if (d.serie) text += `🔢 *Serie:* ${d.serie}\n`;
      if (d.horas) text += `⏱️ *Horas totales:* ${d.horas}\n`;
      text += `🌡️ *Unidad:* ${d.unidad || '°C'}\n`;
      if (d.setpoint) text += `🌡️ *Setpoint:* ${d.setpoint}${d.unidad || '°C'}\n`;
      if (d.retorno) text += `🌡️ *Retorno:* ${d.retorno}${d.unidad || '°C'}\n`;
      if (d.suministro) text += `🌡️ *Suministro:* ${d.suministro}${d.unidad || '°C'}\n`;
      if (d.ambiente) text += `🌡️ *Ambiente:* ${d.ambiente}${d.unidad || '°C'}\n`;
      if (d.delta) text += `🌡️ *Delta T:* ${d.delta}\n`;
      if (d.diagnostico) text += `🧪 *Diagnóstico:* ${d.diagnostico}\n`;
      if (d.trabajo) text += `🔧 *Trabajo realizado:* ${d.trabajo}\n`;
      if (d.refacciones) text += `🧰 *Refacciones:* ${d.refacciones}\n`;
      text += `📌 *Estatus final:* ${d.estado}\n`;
      
      if (d.alarmas && d.alarmas.length > 0) {
        text += `\n🔔 *ALARMAS:*\n`;
        d.alarmas.forEach(a => {
          const emoji = a.status === 'red' ? '🔴' : a.status === 'yellow' ? '🟡' : '🟢';
          text += `${emoji} ${a.code} - ${a.desc}\n`;
        });
      } else {
        text += `\n🔔 *Alarmas:* Ninguna\n`;
      }
      return text;
    }

    // ---- Render con eventos ----
    function render(mode) {
      currentMode = mode;
      container.innerHTML = buildFormHTML(mode);
      document.querySelectorAll('.mode-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.mode === mode);
      });

      // ---- Evento de cambio de unidad ----
      const radios = document.querySelectorAll('input[name="unidadTemp"]');
      radios.forEach(radio => {
        radio.addEventListener('change', function() {
          if (this.checked) {
            const nuevaUnidad = this.value === 'F';
            if (nuevaUnidad !== usarFahrenheit) {
              const inputs = document.querySelectorAll('input[data-temp="true"]');
              inputs.forEach(input => {
                const val = parseFloat(input.value);
                if (!isNaN(val)) {
                  if (!usarFahrenheit) {
                    input.dataset.valorCelsius = val.toString();
                  } else {
                    input.dataset.valorCelsius = fahrenheitToCelsius(val);
                  }
                }
              });
              usarFahrenheit = nuevaUnidad;
              actualizarTemperaturas();
            }
          }
        });
      });

      // ---- Eventos para campos de temperatura ----
      const tempInputs = document.querySelectorAll('input[data-temp="true"]');
      tempInputs.forEach(input => {
        input.addEventListener('input', function() {
          const val = parseFloat(this.value);
          if (!isNaN(val)) {
            if (usarFahrenheit) {
              this.dataset.valorCelsius = fahrenheitToCelsius(val);
            } else {
              this.dataset.valorCelsius = val.toString();
            }
          } else {
            this.dataset.valorCelsius = '';
          }
          calcularDeltaT();
        });
      });

      // ---- Lógica para Técnico "OTRO" ----
      const tecSelect = document.getElementById('full_tecnico_select') || document.getElementById('mini_tecnico_select');
      const tecOtro = document.getElementById('full_tecnico_otro') || document.getElementById('mini_tecnico_otro');
      if (tecSelect && tecOtro) {
        tecSelect.addEventListener('change', function() {
          if (this.value === 'OTRO') {
            tecOtro.style.display = 'block';
            tecOtro.required = true;
          } else {
            tecOtro.style.display = 'none';
            tecOtro.required = false;
          }
        });
      }

      // ---- Lógica para Modelo "OTRO" ----
      const modelSelect = document.getElementById('full_modelo_select');
      const modelOtro = document.getElementById('full_modelo_otro');
      if (modelSelect && modelOtro) {
        modelSelect.addEventListener('change', function() {
          if (this.value === 'OTRO') {
            modelOtro.style.display = 'block';
            modelOtro.required = true;
          } else {
            modelOtro.style.display = 'none';
            modelOtro.required = false;
          }
        });
      }

      // ---- Eventos de alarmas ----
      const addBtn = container.querySelector(`[data-alarm-add="${mode}"]`);
      if (addBtn) {
        addBtn.addEventListener('click', function() {
          const select = document.getElementById(`alarmSelect_${mode}`);
          const customInput = document.getElementById(`alarmCustom_${mode}`);
          let code, status, desc;
          if (select && select.value) {
            const parts = select.value.split('|');
            code = parts[0];
            status = parts[1];
            desc = parts[2];
          } else if (customInput && customInput.value.trim()) {
            code = customInput.value.trim();
            status = 'yellow';
            desc = 'Código personalizado';
          } else {
            alert('Selecciona un código de la lista o escribe uno personalizado.');
            return;
          }
          addAlarm(mode, code, status, desc);
          if (select) select.value = '';
          if (customInput) customInput.value = '';
        });
      }
      container.querySelectorAll('[data-alarm-del]').forEach(btn => {
        btn.addEventListener('click', function() {
          const data = this.dataset.alarmDel.split('|');
          const m = data[0];
          const idx = parseInt(data[1], 10);
          if (m === mode) {
            deleteAlarm(m, idx);
          }
        });
      });

      setTimeout(calcularDeltaT, 50);
    }

    // ---- Modo ----
    document.querySelectorAll('.mode-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        render(this.dataset.mode);
      });
    });

    // ---- Botones ----
    document.getElementById('clearBtn').addEventListener('click', function() {
      if (confirm('¿Limpiar todo el formulario y alarmas?')) {
        alarmState = { full: [], vp: [], mini: [] };
        render(currentMode);
      }
    });

    document.getElementById('printBtn').addEventListener('click', function() {
      window.print();
    });

    let lastPdfBase64 = null;
    let lastPdfName = null;
    let unidadIdEmbed = null;
    let embedMode = false;

    function generarPdfReporte() {
      const d = getFormData();
      const text = generateWhatsAppText();
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit: 'mm', format: 'a4' });
      const margin = 14;
      let y = 16;
      const lineH = 5.5;
      const maxW = 180;

      doc.setFontSize(14);
      doc.setFont(undefined, 'bold');
      doc.text('Thermo King del Noroeste · Diagnóstico TK', margin, y);
      y += 8;
      doc.setFontSize(10);
      doc.setFont(undefined, 'normal');
      doc.text(new Date().toLocaleString('es-MX'), margin, y);
      y += 8;

      const lines = text.replace(/\*/g, '').split('\n');
      lines.forEach(line => {
        if (y > 280) { doc.addPage(); y = 16; }
        const wrapped = doc.splitTextToSize(line || ' ', maxW);
        wrapped.forEach(w => {
          if (y > 280) { doc.addPage(); y = 16; }
          doc.text(w, margin, y);
          y += lineH;
        });
      });

      const fileName = 'Diagnostico_TK_' + (d.economico || d.cliente || 'unidad').toString().replace(/\s+/g, '_') + '_' + new Date().toISOString().slice(0, 10) + '.pdf';
      lastPdfBase64 = doc.output('datauristring');
      lastPdfName = fileName;

      if (embedMode) {
        document.getElementById('uploadAppBtn').style.display = 'inline-flex';
        alert('PDF generado. Ahora pulsa «Subir a diagnóstico PDF» para guardarlo en la unidad.');
      } else {
        doc.save(fileName);
        alert('PDF descargado: ' + fileName);
      }
      return { base64: lastPdfBase64, name: fileName, text: text, data: d };
    }

    
    ;
    }

    document.getElementById('savePdfBtn').addEventListener('click', function() {
      try { generarPdfReporte(); }
      catch (e) { console.error(e); alert('Error al generar PDF: ' + (e.message || e)); }
    });

    document.getElementById('uploadAppBtn').addEventListener('click', function() {
      if (!lastPdfBase64) { alert('Primero genera el PDF'); return; }
      const d = getFormData();
      const resumen = (d.diagnostico || d.falla || d.trabajo || '').substring(0, 2000);
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({
          type: 'tk-diag-pdf',
          unidadId: unidadIdEmbed,
          pdfBase64: lastPdfBase64,
          pdfName: lastPdfName,
          diagnosticoTexto: resumen,
          formData: d
        }, '*');
      } else {
        alert('Abre TK Diag desde la app de unidades para subir el PDF.');
      }
    });

    document.getElementById('closeEmbedBtn').addEventListener('click', function() {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: 'tk-diag-close' }, '*');
      }
    });

    document.getElementById('whatsappTextBtn').addEventListener('click', function() {
      const text = generateWhatsAppText();
      window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
    });

    document.getElementById('whatsappPdfBtn').addEventListener('click', function() {
      try { generarPdfReporte(); } catch (e) {}
      const text = generateWhatsAppText();
      window.open('https://wa.me/?text=' + encodeURIComponent('Reporte PDF Thermo King\n\n' + text), '_blank');
    });

    function aplicarPrefill(data) {
      if (!data) return;
      setTimeout(function() {
        function setVal(id, val) {
          var el = document.getElementById(id);
          if (el && val != null && val !== '') el.value = val;
        }
        setVal('full_cliente', data.cliente);
        setVal('mini_cliente', data.cliente);
        setVal('full_economico', data.no_unidad || data.economico);
        setVal('mini_economico', data.no_unidad || data.economico);
        setVal('full_serie', data.no_serie || data.serie);
        setVal('mini_serie', data.no_serie || data.serie);
        setVal('full_placas_caja', data.placas);
        setVal('mini_placas', data.placas);
        setVal('full_diagnostico', data.problema || data.falla_llegada || '');
        setVal('mini_falla', data.problema || data.falla_llegada || '');
        var modelSelect = document.getElementById('full_modelo_select');
        if (modelSelect && data.modelo) {
          var opts = Array.from(modelSelect.options).map(function(o) { return o.value; });
          if (opts.indexOf(data.modelo) >= 0) modelSelect.value = data.modelo;
          else {
            modelSelect.value = 'OTRO';
            var otro = document.getElementById('full_modelo_otro');
            if (otro) { otro.style.display = 'block'; otro.value = data.modelo; }
          }
        }
      }, 120);
    }

    var params = new URLSearchParams(window.location.search);
    unidadIdEmbed = params.get('unidadId') ? parseInt(params.get('unidadId'), 10) : null;
    embedMode = params.get('embed') === '1' || (window.parent && window.parent !== window);
    if (embedMode) {
      document.getElementById('closeEmbedBtn').style.display = 'inline-flex';
      document.getElementById('uploadAppBtn').style.display = 'none';
    }
    var prefill = null;
    try { if (params.get('data')) prefill = JSON.parse(decodeURIComponent(params.get('data'))); } catch (e) {}
    try {
      if (!prefill) {
        var raw = localStorage.getItem('tk_diag_prefill');
        if (raw) prefill = JSON.parse(raw);
      }
    } catch (e) {}

    render('full');
    if (prefill) aplicarPrefill(prefill);
  })();
</script>
</body>
</html>
