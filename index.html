<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>ThermoControl - Taller Thermoking</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f0f2f5; padding: 12px; }
        
        .header {
            background: #1a3a5c;
            color: white;
            padding: 14px 20px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 16px;
        }
        .header h1 { font-size: 22px; }
        .header h1 small { font-size: 14px; opacity: 0.7; }
        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .header-actions input {
            padding: 8px 14px;
            border-radius: 20px;
            border: none;
            font-size: 14px;
            width: 220px;
        }
        .btn-header {
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn-header:hover { background: rgba(255,255,255,0.3); }
        .btn-header.active { background: #28a745; }
        .btn-header.danger { background: #dc3545; }
        .btn-header.danger:hover { background: #c82333; }

        .stats {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        .stat-item {
            background: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .stat-item .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }

        .kanban-container {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 12px;
            margin-top: 12px;
        }
        .kanban-col {
            background: #e9ecef;
            border-radius: 10px;
            padding: 10px;
            min-height: 400px;
            max-height: 75vh;
            overflow-y: auto;
        }
        .kanban-col::-webkit-scrollbar { width: 4px; }
        .kanban-col::-webkit-scrollbar-thumb { background: #ccc; border-radius: 10px; }
        .kanban-col h4 {
            text-align: center;
            color: white;
            padding: 6px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 10px;
            position: sticky;
            top: 0;
            z-index: 5;
        }
        .kanban-col .count {
            background: rgba(0,0,0,0.2);
            padding: 0 8px;
            border-radius: 12px;
            font-size: 12px;
        }

        .card-compact {
            background: white;
            border-radius: 8px;
            padding: 8px 10px;
            margin-bottom: 8px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            border-left: 4px solid #ccc;
            font-size: 12px;
            transition: 0.2s;
            cursor: pointer;
        }
        .card-compact:hover { transform: scale(1.02); box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
        .card-compact .unidad-id { font-weight: bold; font-size: 14px; color: #1a3a5c; }
        .card-compact .cliente { color: #555; font-size: 12px; }
        .card-compact .fechas { font-size: 10px; color: #888; margin-top: 2px; }
        .card-compact .meta {
            display: flex;
            justify-content: space-between;
            margin-top: 4px;
            font-size: 11px;
            color: #777;
            flex-wrap: wrap;
            gap: 2px;
        }
        .card-compact .badge-area {
            background: #e9ecef;
            padding: 0 8px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: bold;
        }
        .card-compact .tiempo { font-size: 10px; color: #888; }
        .card-compact .tiempo.warning { color: #dc3545; font-weight: bold; }
        .card-compact .btn-accion {
            background: transparent;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 1px 6px;
            font-size: 10px;
            cursor: pointer;
            transition: 0.2s;
        }
        .card-compact .btn-accion:hover { background: #1a3a5c; color: white; border-color: #1a3a5c; }

        .lista-container {
            display: none;
            background: white;
            border-radius: 10px;
            overflow: auto;
            margin-top: 12px;
            max-height: 75vh;
        }
        .lista-container table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .lista-container th {
            background: #1a3a5c;
            color: white;
            padding: 8px 10px;
            text-align: left;
            position: sticky;
            top: 0;
            z-index: 5;
        }
        .lista-container td { padding: 6px 10px; border-bottom: 1px solid #eee; }
        .lista-container tr:hover { background: #f8f9fa; cursor: pointer; }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 999;
            padding: 20px;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background: white;
            border-radius: 16px;
            padding: 24px;
            max-width: 520px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-content.wide { max-width: 650px; }
        .modal-content h3 { margin-bottom: 12px; }
        .modal-content .form-group { margin-bottom: 12px; }
        .modal-content .form-group label {
            display: block;
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 4px;
        }
        .modal-content .form-group input,
        .modal-content .form-group select,
        .modal-content .form-group textarea {
            width: 100%;
            padding: 8px 12px;
            border: 2px solid #dde1e6;
            border-radius: 8px;
            font-size: 14px;
        }
        .modal-content .form-group textarea { resize: vertical; min-height: 50px; }
        .btn-modal {
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 4px;
        }
        .btn-modal.success { background: #28a745; color: white; }
        .btn-modal.danger { background: #dc3545; color: white; }
        .btn-modal.primary { background: #1a3a5c; color: white; }
        .btn-modal.secondary { background: #6c757d; color: white; }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        .persona-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 8px;
            background: #f8f9fa;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }
        .persona-item:hover { background: #e9ecef; }
        .persona-item input[type="radio"] { width: 16px; height: 16px; margin: 0; flex-shrink: 0; }
        .persona-item label { font-size: 13px; cursor: pointer; flex: 1; }
        .personas-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }

        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
            font-size: 18px;
        }
        .loading .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #1a3a5c;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Detalle */
        .detalle-header {
            background: #1a3a5c;
            color: white;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 16px;
        }
        .detalle-header h2 { font-size: 20px; margin-bottom: 4px; }
        .detalle-header .subtitulo { opacity: 0.85; font-size: 14px; }
        .detalle-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }
        .detalle-item {
            background: #f8f9fa;
            padding: 10px 12px;
            border-radius: 8px;
            border-left: 3px solid #1a3a5c;
        }
        .detalle-item .label {
            font-size: 11px;
            color: #666;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 2px;
        }
        .detalle-item .valor {
            font-size: 14px;
            color: #222;
            word-break: break-word;
        }
        .detalle-item.full { grid-column: 1 / -1; }
        .historial-box {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 12px;
            max-height: 200px;
            overflow-y: auto;
        }
        .historial-item {
            padding: 8px 0;
            border-bottom: 1px solid #e9ecef;
            font-size: 13px;
        }
        .historial-item:last-child { border-bottom: none; }
        .historial-item .fecha { color: #888; font-size: 11px; }
        .badge-estatus {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            color: white;
            font-size: 13px;
            font-weight: bold;
        }

        @media (max-width: 1200px) { .kanban-container { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 768px) {
            .kanban-container { grid-template-columns: repeat(2, 1fr); }
            .header h1 { font-size: 18px; }
            .header-actions input { width: 140px; }
            .grid-2, .grid-3, .detalle-grid { grid-template-columns: 1fr; }
            .personas-grid { grid-template-columns: 1fr; }
        }
        @media (max-width: 480px) {
            .kanban-container { grid-template-columns: 1fr 1fr; gap: 6px; }
            .kanban-col { padding: 6px; min-height: 200px; }
            .card-compact { font-size: 10px; padding: 5px 8px; }
            .card-compact .unidad-id { font-size: 12px; }
        }
    </style>
</head>
<body>

<!-- ===== HEADER ===== -->
<div class="header">
    <h1>❄️ ThermoControl <small>Base de Datos en la Nube</small></h1>
    <div class="header-actions">
        <input type="text" id="searchGlobal" placeholder="🔍 Buscar unidad..." oninput="renderizarTablero()">
        <button class="btn-header" id="btnVistaKanban" onclick="cambiarVista('kanban')">📊 Kanban</button>
        <button class="btn-header" id="btnVistaLista" onclick="cambiarVista('lista')">📋 Lista</button>
        <button class="btn-header" id="btnVistaHistorial" onclick="cambiarVista('historial')">📜 Historial</button>
        <button class="btn-header" onclick="abrirModalNueva()">➕ Nueva</button>
        <button class="btn-header" onclick="alternarModoCliente()">👁️ Cliente</button>
        <button class="btn-header danger" onclick="cargarDatos()">🔄 Recargar</button>
        <span id="statusConexion" style="color:white; font-size:12px; padding:4px 10px; background:rgba(255,255,255,0.15); border-radius:12px;">⏳ Conectando...</span>
    </div>
</div>

<!-- ===== ESTADÍSTICAS ===== -->
<div class="stats" id="statsContainer"></div>

<!-- ===== LOADING ===== -->
<div id="loadingContainer" class="loading" style="display:none;">
    <div class="spinner"></div>
    <p>Cargando datos desde la nube...</p>
</div>

<!-- ===== CONTENEDOR KANBAN ===== -->
<div id="kanbanContainer" class="kanban-container"></div>

<!-- ===== CONTENEDOR LISTA ===== -->
<div id="listaContainer" class="lista-container"></div>

<!-- ===== CONTENEDOR HISTORIAL ===== -->
<div id="historialContainer" class="lista-container"></div>

<!-- ===== MODAL NUEVA ===== -->
<div class="modal" id="modalNueva">
    <div class="modal-content">
        <h3>➕ Nueva Unidad</h3>
        <form id="formNueva">
            <div class="grid-2">
                <div class="form-group">
                    <label>Número de Unidad *</label>
                    <input type="text" id="noUnidadNueva" placeholder="Ej: TK-2026-001" required>
                </div>
                <div class="form-group">
                    <label>Folio</label>
                    <input type="text" id="folioNueva" placeholder="Folio interno">
                </div>
            </div>
            <div class="form-group">
                <label>Cliente *</label>
                <input type="text" id="clienteNueva" placeholder="Nombre del cliente" required>
            </div>
            <div class="grid-2">
                <div class="form-group">
                    <label>Modelo</label>
                    <input type="text" id="modeloNueva" placeholder="Ej: ThermoKing T-800">
                </div>
                <div class="form-group">
                    <label>No. de Placas</label>
                    <input type="text" id="placasNueva" placeholder="Placas del vehículo">
                </div>
            </div>
            <div class="grid-2">
                <div class="form-group">
                    <label>No. de Serie del Equipo</label>
                    <input type="text" id="noSerieNueva" placeholder="Número de serie">
                </div>
                <div class="form-group">
                    <label>Orden de Compra</label>
                    <input type="text" id="ordenCompraNueva" placeholder="OC-XXXX">
                </div>
            </div>
            <div class="form-group">
                <label>Hoja de Servicio</label>
                <input type="text" id="hojaServicioNueva" placeholder="Número de hoja de servicio">
            </div>
            <div class="form-group">
                <label>Problema / Descripción</label>
                <textarea id="problemaNueva" rows="2" placeholder="Describe el problema..."></textarea>
            </div>
            <div class="grid-2">
                <div class="form-group">
                    <label>🔧 Diagnosticador</label>
                    <input type="text" id="diagnosticadorNueva" placeholder="Nombre">
                </div>
                <div class="form-group">
                    <label>🛠️ Reparador</label>
                    <input type="text" id="reparadorNueva" placeholder="Nombre">
                </div>
            </div>
            <div class="form-group">
                <label>Estatus inicial</label>
                <select id="estatusNueva">
                    <option value="Recibida">📥 Recibida</option>
                    <option value="Diagnosticando">🔍 Diagnosticando</option>
                    <option value="Cotizando">💰 Cotizando</option>
                    <option value="Espera de refacciones">⏳ Espera de refacciones</option>
                    <option value="Reparando">🔧 Reparando</option>
                    <option value="Finalizada">✅ Finalizada</option>
                </select>
            </div>
            <button type="submit" class="btn-modal success">✅ Agregar</button>
            <button type="button" class="btn-modal danger" onclick="cerrarModal('modalNueva')">❌ Cancelar</button>
        </form>
    </div>
</div>

<!-- ===== MODAL EDITAR ===== -->
<div class="modal" id="modalEditar">
    <div class="modal-content">
        <h3>✏️ Editar Unidad</h3>
        <p id="infoEditar" style="color:#1a3a5c; font-weight:bold; margin-bottom:12px;"></p>
        <form id="formEditar">
            <div class="grid-2">
                <div class="form-group">
                    <label>Número de Unidad</label>
                    <input type="text" id="noUnidadEditar">
                </div>
                <div class="form-group">
                    <label>Folio</label>
                    <input type="text" id="folioEditar">
                </div>
            </div>
            <div class="form-group">
                <label>Cliente</label>
                <input type="text" id="clienteEditar">
            </div>
            <div class="grid-2">
                <div class="form-group">
                    <label>Modelo</label>
                    <input type="text" id="modeloEditar">
                </div>
                <div class="form-group">
                    <label>No. de Placas</label>
                    <input type="text" id="placasEditar">
                </div>
            </div>
            <div class="grid-2">
                <div class="form-group">
                    <label>No. de Serie del Equipo</label>
                    <input type="text" id="noSerieEditar">
                </div>
                <div class="form-group">
                    <label>Orden de Compra</label>
                    <input type="text" id="ordenCompraEditar">
                </div>
            </div>
            <div class="form-group">
                <label>Hoja de Servicio</label>
                <input type="text" id="hojaServicioEditar">
            </div>
            <div class="form-group">
                <label>Problema / Descripción</label>
                <textarea id="problemaEditar" rows="2"></textarea>
            </div>
            <div class="grid-2">
                <div class="form-group">
                    <label>🔧 Diagnosticador</label>
                    <input type="text" id="diagnosticadorEditar" placeholder="Nombre">
                </div>
                <div class="form-group">
                    <label>🛠️ Reparador</label>
                    <input type="text" id="reparadorEditar" placeholder="Nombre">
                </div>
            </div>
            <div class="form-group">
                <label>📅 Fecha de salida (si aplica)</label>
                <input type="date" id="fechaSalidaEditar">
            </div>
            <button type="submit" class="btn-modal primary">💾 Guardar cambios</button>
            <button type="button" class="btn-modal danger" onclick="cerrarModal('modalEditar')">❌ Cancelar</button>
        </form>
    </div>
</div>

<!-- ===== MODAL DETALLE ===== -->
<div class="modal" id="modalDetalle">
    <div class="modal-content wide">
        <div class="detalle-header" id="detalleHeader">
            <h2 id="detalleTitulo">—</h2>
            <div class="subtitulo" id="detalleSubtitulo">—</div>
        </div>
        
        <div style="margin-bottom:12px;">
            <span class="badge-estatus" id="detalleEstatus">—</span>
        </div>

        <div class="detalle-grid" id="detalleGrid"></div>

        <h4 style="margin:16px 0 8px; color:#1a3a5c;">📜 Historial de cambios</h4>
        <div class="historial-box" id="detalleHistorial"></div>

        <div style="display:flex; gap:8px; margin-top:16px; flex-wrap:wrap;" id="detalleBotones">
            <button class="btn-modal primary" style="flex:1;" onclick="cerrarModal('modalDetalle'); abrirModalEditar(unidadEnEdicion)">✏️ Editar</button>
            <button class="btn-modal secondary" style="flex:1;" onclick="cerrarModal('modalDetalle'); abrirModalCambio(unidadEnEdicion)">🔄 Cambiar estatus</button>
            <button class="btn-modal danger" style="flex:1;" onclick="cerrarModal('modalDetalle')">Cerrar</button>
        </div>
    </div>
</div>

<!-- ===== MODAL CAMBIO ESTATUS ===== -->
<div class="modal" id="modalCambio">
    <div class="modal-content">
        <h3>🔄 Cambiar estatus</h3>
        <p id="infoUnidadCambio" style="font-weight:bold; color:#1a3a5c; margin-bottom:12px;"></p>
        <p id="estatusActualInfo" style="font-size:13px; color:#666; margin-bottom:12px;"></p>
        
        <div class="form-group">
            <label>👤 Área que realiza el cambio *</label>
            <select id="areaCambio" onchange="actualizarPersonas(); actualizarEstatusPermitidos()">
                <option value="">Seleccionar área...</option>
                <option value="Gerencia">👔 Gerencia</option>
                <option value="Mantenimiento">🔧 Mantenimiento</option>
                <option value="Ventas">💰 Ventas</option>
                <option value="Compras">🛒 Compras</option>
            </select>
        </div>

        <div class="form-group" id="personasContainer">
            <label>Selecciona la persona:</label>
            <div id="personasList" class="personas-grid"></div>
        </div>
        <div class="form-group" id="nombrePersonalizadoContainer" style="display:none;">
            <label>Escribe el nombre:</label>
            <input type="text" id="nombrePersonalizado" placeholder="Ingresa el nombre">
        </div>

        <div class="form-group">
            <label>Nuevo estatus *</label>
            <select id="estatusCambio">
                <option value="">Primero selecciona un área...</option>
            </select>
            <small id="ayudaPermisos" style="color:#666; font-size:12px; display:block; margin-top:4px;"></small>
        </div>

        <div class="form-group">
            <label>🔑 Clave del departamento *</label>
            <input type="password" id="claveCambio" placeholder="Ingresa la clave de 3 dígitos" maxlength="3" inputmode="numeric" pattern="[0-9]*">
        </div>

        <div class="form-group">
            <label>Comentario (opcional)</label>
            <input type="text" id="comentarioCambio" placeholder="Opcional">
        </div>
        <button class="btn-modal primary" onclick="confirmarCambio()">✅ Confirmar cambio</button>
        <button class="btn-modal danger" onclick="cerrarModal('modalCambio')">❌ Cancelar</button>
    </div>
</div>

    let unidades = [];
    let modoCliente = false;

    // ===== FUNCIONES CRUD =====

    async function cargarDatos() {
        const loading = document.getElementById('loadingContainer');
        loading.style.display = 'block';
        document.getElementById('kanbanContainer').innerHTML = '';
        
        try {
            const { data, error } = await supabaseClient
                .from('unidades')
                .select('*')
                .order('created_at', { ascending: false });
            
            if (error) throw error;
            
            unidades = data || [];
            renderizarTablero();
            actualizarStats();
            document.getElementById('statusConexion').innerHTML = '✅ Conectado';
            document.getElementById('statusConexion').style.background = 'rgba(40, 167, 69, 0.3)';
        } catch (error) {
            console.error('Error al cargar datos:', error);
            document.getElementById('statusConexion').innerHTML = '❌ Error: ' + (error.message || '').substring(0, 40);
            document.getElementById('statusConexion').style.background = 'rgba(220, 53, 69, 0.3)';
            unidades = [];
        } finally {
            loading.style.display = 'none';
        }
    }

    async function agregarUnidad(nuevaUnidad) {
        try {
            const { data, error } = await supabaseClient
                .from('unidades')
                .insert([nuevaUnidad])
                .select();
            
            if (error) throw error;
            
            unidades = [data[0], ...unidades];
            renderizarTablero();
            actualizarStats();
            return { success: true, data: data[0] };
        } catch (error) {
            console.error('Error al agregar:', error);
            alert('❌ Error al agregar unidad: ' + error.message);
            return { success: false, error: error.message };
        }
    }

    async function actualizarUnidad(id, datos) {
        try {
            const { data, error } = await supabaseClient
                .from('unidades')
                .update(datos)
                .eq('id', id)
                .select();
            
            if (error) throw error;
            
            const index = unidades.findIndex(u => u.id === id);
            if (index !== -1) {
                unidades[index] = { ...unidades[index], ...datos };
            }
            renderizarTablero();
            actualizarStats();
            return { success: true, data: data[0] };
        } catch (error) {
            console.error('Error al actualizar:', error);
            alert('❌ Error al actualizar: ' + error.message);
            return { success: false, error: error.message };
        }
    }

    // Soft-delete: marca como eliminado pero guarda el registro en historial
    async function eliminarUnidadBD(id) {
        if (!confirm('¿Archivar / quitar esta unidad del tablero?\n\nEl registro se conservará en el Historial.')) return;
        
        try {
            const { error } = await supabaseClient
                .from('unidades')
                .update({ eliminado: true })
                .eq('id', id);
            
            if (error) throw error;
            
            const index = unidades.findIndex(u => u.id === id);
            if (index !== -1) {
                unidades[index].eliminado = true;
            }
            renderizarTablero();
            actualizarStats();
            alert('✅ Unidad archivada.\nEl registro se conserva en Historial.');
        } catch (error) {
            console.error('Error al archivar:', error);
            alert('❌ Error al archivar: ' + error.message);
        }
    }

    // Eliminación permanente: solo Gerencia con clave 210
    async function eliminarPermanente(id) {
        const u = unidades.find(item => item.id === id);
        if (!u) return;

        const clave = prompt('🔑 Solo Gerencia puede borrar permanentemente.\n\nIngresa la clave de Gerencia:');
        if (clave === null) return; // canceló

        if (clave.trim() !== clavesPorArea['Gerencia']) {
            alert('❌ Clave incorrecta. No se eliminó el registro.');
            return;
        }

        if (!confirm(`⚠️ ¿ELIMINAR PERMANENTEMENTE la unidad ${u.no_unidad}?\n\nEsta acción NO se puede deshacer.`)) return;

        try {
            const { error } = await supabaseClient
                .from('unidades')
                .delete()
                .eq('id', id);
            
            if (error) throw error;
            
            unidades = unidades.filter(item => item.id !== id);
            renderizarTablero();
            actualizarStats();
            cerrarModal('modalDetalle');
            alert('✅ Registro eliminado permanentemente.');
        } catch (error) {
            console.error('Error al eliminar permanentemente:', error);
            alert('❌ Error al eliminar: ' + error.message);
        }
    }

        if (!fecha) return '—';
        const d = new Date(fecha);
        return d.toLocaleDateString('es-MX', { day: '2-digit', month: 'short', year: 'numeric' });
    }

    function diasEnEstatus(historial) {
        if (!historial || historial.length === 0) return 0;
        const ultimo = historial[historial.length - 1];
        const fecha = new Date(ultimo.fecha);
        const ahora = new Date();
        const diff = (ahora - fecha) / (1000 * 60 * 60 * 24);
        return Math.floor(diff);
    }

    function actualizarStats() {
        const container = document.getElementById('statsContainer');
        const activas = unidades.filter(u => !u.eliminado);
        const total = activas.length;
        const counts = {};
        Object.keys(colores).forEach(s => counts[s] = 0);
        activas.forEach(u => { if(counts[u.estatus] !== undefined) counts[u.estatus]++; });
        let html = `<div class="stat-item">📦 Total: ${total}</div>`;
        for(const [status, color] of Object.entries(colores)) {
            html += `<div class="stat-item"><span class="dot" style="background:${color}"></span> ${nombresEstatus[status]}: ${counts[status]||0}</div>`;
        }
        container.innerHTML = html;
    }

            !u.eliminado && (
                (u.no_unidad || '').toLowerCase().includes(search) ||
                (u.cliente || '').toLowerCase().includes(search) ||
                (u.modelo && u.modelo.toLowerCase().includes(search)) ||
                (u.placas && u.placas.toLowerCase().includes(search)) ||
                (u.no_serie && u.no_serie.toLowerCase().includes(search)) ||

                (u.orden_compra && u.orden_compra.toLowerCase().includes(search))

                    <div class="unidad-id">${u.no_unidad || '—'}</div>
                    <div class="cliente">${u.cliente || '—'} ${u.modelo ? '· '+u.modelo : ''}</div>

            )
            .sort((a, b) => {

                    <th>Folio</th>
                    <th>No. Serie</th>
                    <th>Orden Compra</th>
                    <th>Hoja Servicio</th>
                    <th>Llegada</th>
                    <th>Salida</th>
                    <th>Estado</th>
                    <th>Diagnosticó</th>
                    <th>Reparó</th>
                </tr></thead>
                <tbody>
        `;

        if (registrosHistorial.length === 0) {
            histHtml += `<tr><td colspan="13" style="text-align:center; padding:30px; color:#888;">No hay registros en el historial</td></tr>`;
        } else {
            registrosHistorial.forEach(u => {
                const estadoLabel = u.eliminado ? '<span style="color:#dc3545; font-weight:bold;">Archivada</span>' : '<span style="color:#28a745;">Finalizada</span>';
                histHtml += `
                    <tr onclick="abrirModalDetalle(${u.id})" title="Clic para ver detalle completo">
                        <td><strong>${u.no_unidad || '—'}</strong></td>
                        <td>${u.cliente || '—'}</td>
                        <td>${u.modelo || '—'}</td>
                        <td>${u.placas || '—'}</td>
                        <td>${u.folio || '—'}</td>
                        <td>${u.no_serie || '—'}</td>
                        <td>${u.orden_compra || '—'}</td>
                        <td>${u.hoja_servicio || '—'}</td>
                        <td>${formatearFecha(u.fecha_llegada)}</td>
                        <td>${formatearFecha(u.fecha_salida)}</td>
                        <td>${estadoLabel}</td>
                        <td>${u.diagnosticador || '—'}</td>
                        <td>${u.reparador || '—'}</td>
                    </tr>
                `;
            });
        }
        histHtml += '</tbody></table>';
        historialContainer.innerHTML = histHtml;
    }

    function cambiarVista(vista) {
        const kanban = document.getElementById('kanbanContainer');

        const btnK = document.getElementById('btnVistaKanban');
        const btnL = document.getElementById('btnVistaLista');
        const btnH = document.getElementById('btnVistaHistorial');

        // Ocultar todos
        kanban.style.display = 'none';
        lista.style.display = 'none';
        historial.style.display = 'none';
        btnK.classList.remove('active');
        btnL.classList.remove('active');
        btnH.classList.remove('active');

        if (vista === 'kanban') {
            kanban.style.display = 'grid';
            btnK.classList.add('active');
        } else if (vista === 'lista') {
            lista.style.display = 'block';
            btnL.classList.add('active');
        } else if (vista === 'historial') {
            historial.style.display = 'block';
            btnH.classList.add('active');
        }
    }

            placas: document.getElementById('placasEditar').value.trim(),
            no_serie: document.getElementById('noSerieEditar').value.trim(),
            orden_compra: document.getElementById('ordenCompraEditar').value.trim(),
            hoja_servicio: document.getElementById('hojaServicioEditar').value.trim(),
            problema: document.getElementById('problemaEditar').value.trim(),
            diagnosticador: document.getElementById('diagnosticadorEditar').value.trim(),
            reparador: document.getElementById('reparadorEditar').value.trim(),
            fecha_salida: document.getElementById('fechaSalidaEditar').value || null
        };
        
        const u = unidades.find(item => item.id === id);
        if (datos.fecha_salida && u && u.estatus !== 'Finalizada') {
            if (confirm('¿Deseas cambiar el estatus a "Finalizada"?')) {
                datos.estatus = 'Finalizada';
                const historial = u.historial || [];
                historial.push({
                    fecha: new Date().toLocaleString(),
                    estatus: 'Finalizada',
                    area: 'Edición manual',
                    persona: 'Sistema',
                    comentario: 'Fecha de salida asignada'
                });
                datos.historial = historial;
            }
        }
        
        const resultado = await actualizarUnidad(id, datos);
        if (resultado.success) {
            cerrarModal('modalEditar');
            alert('✅ Unidad actualizada en la base de datos');
        }
    });

    // ===== CAMBIO DE ESTATUS =====
    function actualizarPersonas() {
        const area = document.getElementById('areaCambio').value;
        const container = document.getElementById('personasList');
        const personalizadoContainer = document.getElementById('nombrePersonalizadoContainer');
        const personas = personasPorArea[area] || [];
        
        if (area === 'Compras') {
            container.innerHTML = '';
            personalizadoContainer.style.display = 'block';
            document.getElementById('nombrePersonalizado').value = '';
            return;
        }
        
        personalizadoContainer.style.display = 'none';
        
        if (!area) {
            container.innerHTML = '';
            return;
        }
        
        if (personas.length === 0) {
            container.innerHTML = '<p style="color:#888; font-size:13px;">No hay personas registradas para esta área</p>';
            return;
        }
        
        let html = '';
        personas.forEach(persona => {
            html += `
                <div class="persona-item">
                    <input type="radio" name="personaSeleccionada" value="${persona}" id="persona_${persona.replace(/\s/g,'_')}">
                    <label for="persona_${persona.replace(/\s/g,'_')}">${persona}</label>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    function getPersonaSeleccionada() {
        const area = document.getElementById('areaCambio').value;
        if (area === 'Compras') {
            return document.getElementById('nombrePersonalizado').value.trim() || null;
        }
        const radio = document.querySelector('input[name="personaSeleccionada"]:checked');
        return radio ? radio.value : null;
    }

    function actualizarEstatusPermitidos() {
        const area = document.getElementById('areaCambio').value;
        const select = document.getElementById('estatusCambio');
        const ayuda = document.getElementById('ayudaPermisos');
        const u = unidades.find(item => item.id === unidadEnEdicion);
        const estatusActual = u ? u.estatus : null;

        select.innerHTML = '';

        if (!area) {
            select.innerHTML = '<option value="">Primero selecciona un área...</option>';
            ayuda.textContent = '';
            return;
        }

        let opcionesPermitidas = [];

        if (area === 'Gerencia') {
            // Gerencia puede mover a cualquier estatus
            opcionesPermitidas = Object.keys(nombresEstatus);
            ayuda.textContent = '👔 Gerencia puede cambiar a cualquier estatus.';
        } else {
            const permisosArea = permisosCambio[area];
            if (permisosArea && estatusActual && permisosArea[estatusActual]) {
                opcionesPermitidas = permisosArea[estatusActual];
                ayuda.textContent = `✅ Desde "${estatusActual}" puedes pasar a: ${opcionesPermitidas.join(', ')}`;
            } else {
                ayuda.textContent = `⚠️ El área ${area} no tiene permisos para mover unidades desde el estatus actual "${estatusActual}".`;
                select.innerHTML = '<option value="">Sin movimientos permitidos</option>';
                return;
            }
        }

        opcionesPermitidas.forEach(est => {
            const opt = document.createElement('option');
            opt.value = est;
            opt.textContent = nombresEstatus[est] || est;
            select.appendChild(opt);
        });
    }

    function abrirModalCambio(id) {
        if(modoCliente) return;
        const u = unidades.find(item => item.id === id);
        if (!u) return;
        unidadEnEdicion = id;
        document.getElementById('infoUnidadCambio').textContent = `${u.no_unidad} - ${u.cliente}`;
        document.getElementById('estatusActualInfo').textContent = `Estatus actual: ${nombresEstatus[u.estatus] || u.estatus}`;
        document.getElementById('areaCambio').value = '';
        document.getElementById('estatusCambio').innerHTML = '<option value="">Primero selecciona un área...</option>';
        document.getElementById('ayudaPermisos').textContent = '';
        document.getElementById('claveCambio').value = '';
        document.getElementById('comentarioCambio').value = '';
        document.getElementById('nombrePersonalizado').value = '';
        document.getElementById('personasList').innerHTML = '';
        document.getElementById('nombrePersonalizadoContainer').style.display = 'none';
        document.getElementById('modalCambio').style.display = 'flex';
    }

    async function confirmarCambio() {
        const id = unidadEnEdicion;
        if (!id) return;
        
        const area = document.getElementById('areaCambio').value;
        if (!area) { 
            alert('⚠️ Selecciona un área'); 
            return; 
        }
        
        const persona = getPersonaSeleccionada();
        if (!persona) {
            alert('⚠️ Selecciona o escribe el nombre de la persona');
            return;
        }
        
        const nuevoEstatus = document.getElementById('estatusCambio').value;
        if (!nuevoEstatus) {
            alert('⚠️ Selecciona el nuevo estatus');
            return;
        }

        // Validar clave del departamento
        const claveIngresada = document.getElementById('claveCambio').value.trim();
        const claveCorrecta = clavesPorArea[area];
        
        if (!claveIngresada) {
            alert('⚠️ Ingresa la clave del departamento');
            return;
        }
        
        if (claveIngresada !== claveCorrecta) {
            alert('❌ Clave incorrecta. No se realizó el cambio.');
            document.getElementById('claveCambio').value = '';
            document.getElementById('claveCambio').focus();
            return;
        }

        // Validar permisos de transición (por seguridad extra)
        const u = unidades.find(item => item.id === id);
        if (!u) return;

        if (area !== 'Gerencia') {
            const permisosArea = permisosCambio[area];
            const permitidos = permisosArea && permisosArea[u.estatus] ? permisosArea[u.estatus] : [];
            if (!permitidos.includes(nuevoEstatus)) {
                alert(`❌ El área ${area} no tiene permiso para cambiar de "${u.estatus}" a "${nuevoEstatus}".`);
                return;
            }
        }
        
        const comentario = document.getElementById('comentarioCambio').value.trim();
        
        const historial = u.historial || [];
        historial.push({
            fecha: new Date().toLocaleString(),
            estatus: nuevoEstatus,
            area: area,
            persona: persona,
            comentario: comentario || `Cambio autorizado con clave de ${area}`
        });
        
        const datos = {
            estatus: nuevoEstatus,
            historial: historial
        };
        
        if (nuevoEstatus === 'Finalizada' && !u.fecha_salida) {
            datos.fecha_salida = new Date().toISOString().split('T')[0];
        }
        
        const resultado = await actualizarUnidad(id, datos);
        if (resultado.success) {
            cerrarModal('modalCambio');
            alert(`✅ Estatus actualizado por ${area} - ${persona}`);
        }
    }

    // ===== INICIALIZAR =====
    window.onclick = function(event) {
        if(event.target.classList.contains('modal')) {
            event.target.style.display = 'none';
        }
    };

    document.getElementById('btnVistaKanban').classList.add('active');
    
    // Cargar datos
    cargarDatos();
</script>
</body>
</html>
