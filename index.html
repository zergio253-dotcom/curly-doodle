<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App en mantenimiento - Thermo King</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b1b2b;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            max-width: 500px;
            z-index: 2;
            padding-bottom: 200px;
        }

        .icon-wrench {
            font-size: 80px;
            margin-bottom: 30px;
            transform: rotate(-45deg);
            display: inline-block;
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 25px;
            letter-spacing: -0.5px;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
            color: #d1d5db;
            margin-bottom: 15px;
            font-weight: 400;
        }

        .brand {
            font-size: 14px;
            color: #6b7280;
            margin-top: 30px;
            letter-spacing: 0.5px;
            font-weight: 400;
        }

        .email-link {
            font-size: 15px;
            color: #60a5fa;
            margin-top: 10px;
            letter-spacing: 0.5px;
            font-weight: 500;
            text-decoration: none;
            transition: color 0.3s ease;
            display: inline-block;
        }

        .email-link:hover {
            color: #93c5fd;
            text-decoration: underline;
        }

        .cat-container {
            position: absolute;
            bottom: 0px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            pointer-events: none;
            z-index: 1;
        }

        .cat-image {
            max-width: 220px;
            height: auto;
            opacity: 0.95;
            filter: drop-shadow(0px 10px 15px rgba(0,0,0,0.5));
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        @media (max-width: 480px) {
            h1 { font-size: 26px; }
            p { font-size: 16px; }
            .icon-wrench { font-size: 60px; }
            .cat-image { max-width: 150px; }
            .container { padding-bottom: 160px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon-wrench">🔧</div>

        <h1>App en mantenimiento</h1>
        <p>Estamos realizando labores de mantenimiento para mejorar el servicio.</p>
        <p>Gracias por su comprensión.</p>

        <div class="brand">Thermo King · Sistema de taller</div>
        <a href="mailto:zergio253@gmail.com" class="email-link">zergio253@gmail.com</a>
    </div>

    <div class="cat-container">
        <!-- Aquí va la imagen del gato. Puedes usar una URL o un archivo local -->
        <img 
            src="https://i.imgur.com/8YwWl0k.png" 
            alt="Gato de mantenimiento" 
            class="cat-image"
        >
    </div>

</body>
</html>
